<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSV to Keyed JSON Converter</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css">
</head>
<body>
  <h1>📄 CSV → Keyed JSON Converter</h1>
  <p class="info">
    For general usage instructions, troubleshooting, and examples, visit the
    <a href="#" id="readmeLink" aria-label="Open README for general app usage guidance">README</a>.
  </p>

  <!-- Input -->
  <div class="card">
    <h2>1. Load CSV</h2>
    <div class="row">
      <div class="col">
        <label>Upload CSV File</label>
        <input type="file" id="fileInput" accept=".csv,.tsv,.txt" />
      </div>
      <div class="col">
        <label>Field Separator</label>
        <select id="delimiter">
          <option value="auto">Auto-detect</option>
          <option value=",">Comma (,)</option>
          <option value="	">Tab</option>
          <option value=";">Semicolon (;)</option>
          <option value="|">Pipe (|)</option>
        </select>
      </div>
      <div class="col">
        <label>Encoding</label>
        <select id="encoding">
          <option value="UTF-8">UTF-8</option>
          <option value="ISO-8859-1">ISO-8859-1</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Options -->
  <div class="card">
    <h2>2. Conversion Options</h2>
    <div class="row" style="margin-bottom:1rem;">
      <div class="col">
        <label>Key Field (column used as JSON key)</label>
        <select id="keyField"><option value="0">-- upload a file first --</option></select>
      </div>
      <div class="col">
        <label>Attribute Name Case</label>
        <select id="caseOption">
          <option value="none">As-is</option>
          <option value="lower">Lowercase</option>
          <option value="upper">Uppercase</option>
        </select>
      </div>
    </div>
    <div class="options-grid">
      <label class="check-label"><input type="checkbox" id="autoTypes" checked /> Auto-detect numbers & booleans</label>
      <label class="check-label"><input type="checkbox" id="nullify" checked /> Convert "NULL" → null</label>
      <label class="check-label"><input type="checkbox" id="emptyNull" /> Empty fields → null</label>
      <label class="check-label"><input type="checkbox" id="skipEmpty" /> Skip empty fields entirely</label>
      <label class="check-label"><input type="checkbox" id="headerRow" checked /> First row is column names</label>
      <label class="check-label"><input type="checkbox" id="terseMode" /> Terse mode (one object per line)</label>
    </div>
  </div>

  <!-- Convert & Output -->
  <div class="card">
    <h2>3. Convert & Download</h2>
    <div class="btn-row" style="margin-bottom:1rem;">
      <button id="convertBtn" onclick="convert()">⚡ Convert</button>
      <button id="downloadBtn" onclick="download()">⬇ Download JSON</button>
      <span id="status"></span>
    </div>
    <div id="error"></div>
    <textarea id="output" placeholder="JSON output will appear here..."></textarea>
  </div>

  <!-- Embedded README content -->
  <script type="text/markdown" id="readme-content">
# CSV to Keyed JSON Converter

A simple, client-side web application that converts CSV (Comma-Separated Values) files into keyed JSON format. This tool transforms tabular CSV data into a JSON object where each row becomes a nested object keyed by a specified column value.

## Features

- **File Upload**: Support for CSV, TSV, and TXT files
- **Flexible Delimiters**: Auto-detection or manual selection of field separators (comma, tab, semicolon, pipe)
- **Encoding Support**: UTF-8 and ISO-8859-1 encodings
- **Key Field Selection**: Choose any column to use as the JSON object key
- **Data Type Detection**: Automatic conversion of numbers and booleans
- **Customization Options**:
  - Convert "NULL" strings to null values
  - Treat empty fields as null
  - Skip empty fields entirely
  - Case transformation for attribute names (as-is, lowercase, uppercase)
  - Header row detection
  - Terse mode output (one object per line)
- **Download Support**: Export converted JSON as a file
- **Real-time Preview**: View JSON output in a formatted textarea

## Usage

1. **Load CSV File**: Click "Choose File" and select your CSV file
2. **Configure Options** (optional):
   - Select field separator if auto-detection fails
   - Choose encoding (default: UTF-8)
   - Pick the key field (column to use as JSON keys)
   - Adjust case options and data processing checkboxes
3. **Convert**: Click the "⚡ Convert" button
4. **Download**: Use "⬇ Download JSON" to save the result

## Example

Given a CSV file:
```csv
id,name,age,city
1,John,25,New York
2,Jane,30,London
3,Bob,35,Paris
```

With "id" selected as the key field, the output JSON will be:
```json
{
  "1": {
    "name": "John",
    "age": 25,
    "city": "New York"
  },
  "2": {
    "name": "Jane",
    "age": 30,
    "city": "London"
  },
  "3": {
    "name": "Bob",
    "age": 35,
    "city": "Paris"
  }
}
```

## Requirements

- Modern web browser with JavaScript enabled
- Internet connection (for PapaParse library loading)

## Browser Support

Works in all modern browsers that support:
- File API
- ES6+ JavaScript features
- CSS Grid and Flexbox

## Project Structure

```
csv_to_keyed_json/
├── main.html          # Main HTML file with UI
├── script.js          # JavaScript logic (ES6 class-based)
└── README.md          # This file
```

## Dependencies

- [PapaParse](https://www.papaparse.com/) - CSV parsing library (loaded via CDN)

## Privacy

This is a client-side application. Your CSV files are processed entirely in your browser and are never uploaded to any server.
